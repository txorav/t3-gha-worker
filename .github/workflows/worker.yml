name: T3 Compute Worker

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenCode & Bore Tunnel
        run: |
          curl -fsSL https://opencode.ai/install | bash
          sudo ln -sf /root/.opencode/bin/opencode /usr/local/bin/opencode || true
          mkdir -p ~/.opencode/bin
          export PATH="$HOME/.opencode/bin:/root/.opencode/bin:$PATH"

          # Install bore
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.3/bore-v0.5.3-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tgz
          tar xzf /tmp/bore.tgz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore

          # Warmup opencode
          opencode models || true

      - name: Start Worker and Bore Tunnel
        env:
          T3_WORKER_PORT: "4096"
          T3_WORKER_TOKEN: "t3-gha-worker-token-free"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/workspace
          export PATH="$HOME/.opencode/bin:/root/.opencode/bin:$PATH"

          # Start bridge
          node worker-bridge.mjs > /tmp/worker.log 2>&1 &
          sleep 2

          # Start bore tunnel
          bore local 4096 --to bore.pub > /tmp/bore.log 2>&1 &
          
          # Wait for bore tunnel to establish
          echo "Waiting for bore tunnel..."
          for i in {1..30}; do
            if grep -q "listening at bore.pub:" /tmp/bore.log; then
              PORT=$(grep -oE "listening at bore\.pub:[0-9]+" /tmp/bore.log | head -n1 | cut -d: -f2)
              ENDPOINT="http://bore.pub:${PORT}"
              echo "=========================================="
              echo "T3_WORKER_READY ${ENDPOINT}"
              echo "T3_WORKER_TOKEN: ${T3_WORKER_TOKEN}"
              echo "=========================================="

              # Close existing worker issues
              gh issue list --state open --json number --jq '.[].number' | while read -r num; do
                gh issue close "$num" || true
              done

              # Post new endpoint issue
              gh issue create --title "WORKER_ENDPOINT" --body "{\"endpoint\":\"${ENDPOINT}\",\"token\":\"${T3_WORKER_TOKEN}\"}"
              break
            fi
            sleep 1
          done

          # Keep runner alive while tailing logs
          tail -f /tmp/worker.log /tmp/bore.log
