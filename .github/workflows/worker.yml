name: T3 Compute Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode & Bore Tunnel
        run: |
          curl -fsSL https://opencode.ai/install | bash
          sudo ln -sf /root/.opencode/bin/opencode /usr/local/bin/opencode || true
          mkdir -p ~/.opencode/bin
          export PATH="$HOME/.opencode/bin:/root/.opencode/bin:$PATH"

          # Install bore
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.3/bore-v0.5.3-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tgz
          tar xzf /tmp/bore.tgz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore

      - name: Start Worker and Publish Endpoint
        env:
          T3_WORKER_PORT: "4096"
          T3_WORKER_TOKEN: "t3-gha-worker-free-token"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/workspace
          export PATH="$HOME/.opencode/bin:/root/.opencode/bin:$PATH"

          # Start worker bridge
          node worker-bridge.mjs > /tmp/worker.log 2>&1 &
          sleep 2

          # Start bore tunnel
          bore local 4096 --to bore.pub > /tmp/bore.log 2>&1 &
          
          # Wait for bore tunnel to establish
          echo "Waiting for bore tunnel..."
          for i in {1..30}; do
            if grep -q "listening at bore.pub:" /tmp/bore.log; then
              PORT=$(grep -oE "listening at bore\.pub:[0-9]+" /tmp/bore.log | head -n1 | cut -d: -f2)
              ENDPOINT="http://bore.pub:${PORT}"
              echo "=========================================="
              echo "T3_WORKER_READY ${ENDPOINT}"
              echo "T3_WORKER_TOKEN: ${T3_WORKER_TOKEN}"
              echo "=========================================="
              
              cat <<EOF > /tmp/endpoint.json
{
  "endpoint": "${ENDPOINT}",
  "token": "${T3_WORKER_TOKEN}",
  "run_id": "${{ github.run_id }}",
  "started_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
}
EOF

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git checkout -B endpoint
              cp /tmp/endpoint.json endpoint.json
              git add endpoint.json
              git commit -m "Worker ready at ${ENDPOINT} [skip ci]"
              git push -f origin endpoint
              echo "Endpoint published to branch endpoint successfully!"
              break
            fi
            sleep 1
          done

          # Keep runner alive for up to 6 hours while tailing logs
          tail -f /tmp/worker.log /tmp/bore.log
